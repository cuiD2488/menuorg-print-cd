name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Cache node modules
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: |
        npm ci
        echo "Dependencies installed successfully"

    - name: Verify environment
      run: |
        node --version
        npm --version
        echo "Environment verified"

    - name: Build application
      run: |
        echo "Starting build process..."
        npm run build
        echo "Build completed successfully"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check build output
      run: |
        if (Test-Path "dist") {
          Write-Host "Build output directory exists"
          Get-ChildItem -Path "dist" -Recurse | Format-Table Name, Length
        } else {
          Write-Error "Build output directory not found"
          exit 1
        }
      shell: pwsh

    - name: Create release
      run: |
        echo "Publishing release to GitHub..."
        npm run release
        echo "Release published successfully"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload release artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: release-artifacts
        path: |
          dist/*.exe
          dist/*.yml
          dist/*.blockmap
        retention-days: 30

    - name: Notify success
      if: success()
      run: |
        echo "::notice::Release created successfully! Check the Releases page for the new version."
        echo "Release URL: https://github.com/${{ github.repository }}/releases"

    - name: Handle failure
      if: failure()
      run: |
        echo "::error::Release process failed. Check the logs above for details."
        echo "Common issues:"
        echo "1. GitHub token permissions"
        echo "2. Build configuration errors" 
        echo "3. Network connectivity issues"
        echo "4. Version conflicts" 